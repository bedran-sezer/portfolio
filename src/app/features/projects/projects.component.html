<section id="projects">
    <h2>My Projects</h2>
    <div class="projects-grid">
        <div class="project-card" *ngFor="let project of projects">


            <!-- Image -->
            <img [src]="project.image" [alt]="project.title">

            <!-- Badge type — même principe que le titre -->
            <span>{{ project.type }}</span>

            <h3>{{ project.title }}</h3>

            <p>{{ project.description }}</p>

            <div class="techs">
                <span class="tech-tag" *ngFor="let tech of project.techs">{{ tech }}</span>
            </div>

            <!-- Lien Live — même principe que les ancres de la Navbar -->
            <a [href]="project.live" target="_blank">Live</a>
        </div>
    </div>
</section>
